name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Standard-library tests, TOML, privacy, and architecture scans
        run: python -m unittest discover -s tests -v

      # CI intentionally does not access ModelDial or run a real Codex session.
