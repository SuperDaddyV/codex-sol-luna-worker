name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Standard-library tests, TOML, privacy, and architecture scans
        run: python -m unittest discover -s tests -v

      # CI intentionally does not access ModelDial or run a real Codex session.
